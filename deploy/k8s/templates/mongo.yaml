apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: overleaf-mongo
  labels:
    app: overleaf-mongo
spec:
  publishNotReadyAddresses: true  # CRITICAL FIX 1: Allows Mongo to talk to itself before passing readiness checks
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: overleaf-mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: overleaf-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures old pods release the PVC lock before the new pod boots
  selector:
    matchLabels:
      app: overleaf-mongo
  template:
    metadata:
      labels:
        app: overleaf-mongo
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image | default "mongo:8.0" | quote }}
          command:
            - "mongod"
            - "--replSet"
            - "overleaf"
            - "--bind_ip_all"
          lifecycle:
            postStart:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - |
                    # Wait for local mongo instance to be reachable
                    until mongosh --eval "print(\"waiting\")" --quiet; do sleep 2; done
                    
                    # CRITICAL FIX 2: Smart JS logic to evaluate and force-reconfigure identity mismatches
                    mongosh --quiet --eval '
                      try {
                        var status = rs.status();
                        if (status.ok === 1 && status.myState === 1) {
                          print("Replica set is already healthy and PRIMARY.");
                        } else {
                          throw new Error("Replica set is in an unhealthy state: " + status.myState);
                        }
                      } catch (e) {
                        print("Replica set requires configuration repair. Reason: " + e.message);
                        try {
                          var localDb = db.getSiblingDB("local");
                          var cfg = localDb.system.replset.findOne();
                          if (cfg) {
                            print("Found existing configuration on disk. Updating network identity...");
                            cfg.version = cfg.version + 1;
                            cfg.members = [{ _id: 0, host: "overleaf-mongo:27017" }];
                            db.getSiblingDB("admin").runCommand({ replSetReconfig: cfg, force: true });
                            print("Forced replica set reconfiguration successful.");
                          } else {
                            print("No configuration found on disk. Initializing fresh replica set...");
                            rs.initiate({ _id: "overleaf", members: [{ _id: 0, host: "overleaf-mongo:27017" }] });
                          }
                        } catch (err) {
                          print("Severe configuration or log corruption detected. Wiping replica metadata...");
                          db.getSiblingDB("local").dropDatabase();
                          rs.initiate({ _id: "overleaf", members: [{ _id: 0, host: "overleaf-mongo:27017" }] });
                          print("Replica layer reset completed successfully.");
                        }
                      }
                    '
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          {{- if .Values.mongo.persistence.enabled | default true }}
          persistentVolumeClaim:
            claimName: overleaf-mongo-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- if .Values.mongo.persistence.enabled | default true }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-mongo-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - {{ .Values.mongo.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size | default "5Gi" }}
{{- end }}

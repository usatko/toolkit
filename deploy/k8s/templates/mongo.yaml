apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: overleaf-mongo
  labels:
    app: overleaf-mongo
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: overleaf-mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: overleaf-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overleaf-mongo
  template:
    metadata:
      labels:
        app: overleaf-mongo
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image | default "mongo:8.0" | quote }}
          command:
            - "mongod"
            - "--replSet"
            - "overleaf"
            - "--bind_ip_all"
          lifecycle:
            postStart:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - |
                    # 1. Wait for the local mongod instance to start accepting connections
                    until mongosh --eval "print(\"waiting\")" --quiet; do sleep 2; done
                    
                    # 2. Run an intelligent JS script to check and auto-heal the replica set configuration
                    mongosh --quiet --eval '
                      try {
                        var status = rs.status();
                        if (status.ok === 1) {
                          print("Replica set is healthy and active.");
                        }
                      } catch (e) {
                        print("Replica set requires attention: " + e.message);
                        
                        if (e.message.includes("run rs.initiate")) {
                          print("Fresh database detected. Initializing replica set...");
                          rs.initiate({_id: "overleaf", members: [{_id: 0, host: "overleaf-mongo:27017"}]});
                        } else {
                          print("Invalid replica config or identity mismatch detected. Forcing reconfig...");
                          try {
                            var dbLocal = db.getSiblingDB("local");
                            var cfg = dbLocal.system.replset.findOne();
                            if (cfg) {
                              cfg.version = cfg.version + 1;
                              cfg.members = [{_id: 0, host: "overleaf-mongo:27017"}];
                              db.getSiblingDB("admin").runCommand({replSetReconfig: cfg, force: true});
                              print("Replica set successfully forced to recognize new pod environment.");
                            } else {
                              rs.initiate({_id: "overleaf", members: [{_id: 0, host: "overleaf-mongo:27017"}]});
                            }
                          } catch (err) {
                            print("Reconfiguration failed due to storage engine corruption. Resetting replication metadata...");
                            db.getSiblingDB("local").dropDatabase();
                            rs.initiate({_id: "overleaf", members: [{_id: 0, host: "overleaf-mongo:27017"}]});
                            print("Replication database cleared and re-initialized successfully.");
                          }
                        }
                      }
                    '
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          {{- if .Values.mongo.persistence.enabled | default true }}
          persistentVolumeClaim:
            claimName: overleaf-mongo-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- if .Values.mongo.persistence.enabled | default true }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-mongo-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - {{ .Values.mongo.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size | default "5Gi" }}
{{- end }}
